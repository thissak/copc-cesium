name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # tsc --noEmit + vite (데모 → demo-dist)
      - run: npm run build:lib # tsup 라이브러리 빌드 (dist)
      - run: npm run verify # 헤드리스 정확성(C1) — autzen S3
