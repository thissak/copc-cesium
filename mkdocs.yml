site_name: "CopcCesiumLab — 학습 사이트"
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ko
  font: false
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: 다크 모드 }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: 라이트 모드 }
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  # ?v= 캐시버스터 — Cloudflare가 .css를 4h 캐시하므로 CSS 변경 시 이 값을 갱신해 즉시 반영
  - stylesheets/extra.css?v=20260618

plugins:
  - search:
      separator: '[\s\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 한글 헤딩 앵커 보존 (기본 slugify 는 비ASCII 를 버려 #_1,#_2 가 됨).
      # github 방식(파이썬 생성기 github_slugify)과 정렬 → 렌더러 교체에도 앵커 안정.
      slugify:
        !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  # 코드 스니펫 drift 방지: src 의 실제 코드를 빌드 때 끌어와 인용(마커 region).
  # check_paths → 인용 파일이 사라지면 빌드 실패(파일 rename drift 탐지).
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

# 메뉴: 학습 콘텐츠(index/learn/wiki)를 앞, 원본 AI 작업문서를 "참고" 뒤로.
nav:
  - 홈: index.md
  - 학습:
      - 커리큘럼:
          - learn/index.md
          - learn/01-point-clouds.md
          - learn/02-copc.md
          - learn/03-cesiumjs.md
          - learn/04-coordinate-systems.md
          - learn/05-copc-cesium-integration.md
          - learn/06-streaming-engine-and-production-core.md
          - learn/07-packaging-and-verification.md
      - 아키텍처:
          - arch/index.md
          - arch/00-big-picture.md
          - arch/01-public-api-and-isomorphism.md
          - arch/02-service-worker.md
          - arch/03-worker-decode.md
          - arch/04-lod-delegation.md
          - arch/05-hierarchy-paging.md
          - arch/06-production-core.md
          - arch/07-range-coalescing.md
      - 위키:
          - wiki/index.md
          - wiki/decode-in-worker.md
          - wiki/hierarchy-subpage-paging.md
          - wiki/range-coalescing.md
          - wiki/coalescing-inflight-race.md
          - wiki/crs-georeferencing.md
          - wiki/reproject-grid-approximation.md
  - "참고 (원본 문서)":
      - 문제정의: PROBLEM.md
      - 전략: STRATEGY.md
      - 진행상태: PROGRESS.md
      - 변경이력: CHANGELOG.md
      - 프로파일링: PROFILING.md
      - 결과: RESULTS.md
      - 레퍼런스: REFERENCES.md
      - "설계결정 (ADR)":
          - adr/001-provider-plugin-architecture-A.md
          - adr/002-service-worker-tile-interception.md
          - adr/003-hierarchy-subpage-paging.md
          - adr/004-delegate-memory-concurrency-to-cesium.md
          - adr/005-attribute-fidelity-via-pnts-batch-table.md
          - adr/006-range-coalescing.md
          - adr/007-spatial-reference-metric-separation.md
          - adr/008-cesium-compatibility-contract.md
      - 핸드오프:
          - handoff/phase2-streaming-handoff.md

# 빌드 산출물/메타 문서는 메뉴에서 제외(빌드 경고 억제)
not_in_nav: |
  /superpowers/**
  /wiki/writing-guide.md
