site_name: "CopcCesiumLab — 학습 사이트"
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ko
  font: false
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: 다크 모드 }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: 라이트 모드 }
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      separator: '[\s\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

# 메뉴: 학습 콘텐츠(index/learn/wiki)를 앞, 원본 AI 작업문서를 "참고" 뒤로.
nav:
  - 홈: index.md
  - 학습:
      - 커리큘럼:
          - learn/index.md
          - learn/01-point-clouds.md
          - learn/02-copc.md
          - learn/03-cesiumjs.md
          - learn/04-coordinate-systems.md
          - learn/05-copc-cesium-integration.md
      - 위키:
          - wiki/index.md
          - wiki/decode-on-main-thread.md
  - "참고 (원본 문서)":
      - 문제정의: PROBLEM.md
      - 전략: STRATEGY.md
      - 진행상태: PROGRESS.md
      - 변경이력: CHANGELOG.md
      - 프로파일링: PROFILING.md
      - 결과: RESULTS.md
      - 레퍼런스: REFERENCES.md
      - "설계결정 (ADR)":
          - adr/001-provider-plugin-architecture-A.md
          - adr/002-service-worker-tile-interception.md
      - 핸드오프:
          - handoff/phase2-streaming-handoff.md

# 빌드 산출물/메타 문서는 메뉴에서 제외(빌드 경고 억제)
not_in_nav: |
  /superpowers/**
  /wiki/writing-guide.md
